services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lvm
      POSTGRES_PASSWORD: lvm_dev_only
      POSTGRES_DB: lvm_service
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - lvm_service_db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U lvm -d lvm_service']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  lvm_service_db:
