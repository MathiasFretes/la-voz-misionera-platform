name: Platform

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  platform:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lvm
          POSTGRES_PASSWORD: lvm_dev_only
          POSTGRES_DB: lvm_service
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U lvm -d lvm_service"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build:backend
      - run: npm run db:migrate
        env:
          DATABASE_URL: postgres://lvm:lvm_dev_only@127.0.0.1:5433/lvm_service
      - run: npm run test:backend
        env:
          DATABASE_URL: postgres://lvm:lvm_dev_only@127.0.0.1:5433/lvm_service
      - run: npm run build
        env:
          VITE_SERVICE_BACKEND: postgres
      - run: npx playwright install --with-deps chromium
      - uses: actions/checkout@v4
        with:
          repository: MathiasFretes/lvm-presenter
          ref: ea9a886f4072986c435820a4638a2eaeaae9a92c
          path: presenter-contract
      - run: npm run test:db-e2e
        env:
          DATABASE_URL: postgres://lvm:lvm_dev_only@127.0.0.1:5433/lvm_service
          LVM_PRESENTER_REPO: presenter-contract
      - run: npm run test:db-ops
        env:
          DATABASE_URL: postgres://lvm:lvm_dev_only@127.0.0.1:5433/lvm_service
          LVM_PG_CONTAINER: ${{ job.services.postgres.id }}
      - uses: actions/checkout@v4
        with:
          repository: MathiasFretes/lvm-web-publica
          ref: 007b8961dcc7740217dea0ace8788aab4362bacc
          path: public-contract
      - run: npm ci
        working-directory: public-contract
      - run: npm run test:public-preview
        env:
          PUBLIC_WEB_REPO: public-contract
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: service-postgres-e2e
          path: test-results/
      - run: npm run fixture
      - run: git diff --exit-code -- fixtures/platform-service.json

  private-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/compose.private-smoke.yaml build api
      - run: docker compose -f deploy/compose.private-smoke.yaml up -d db
      - run: docker compose -f deploy/compose.private-smoke.yaml run --rm migrate
      - run: docker compose -f deploy/compose.private-smoke.yaml up -d api
      - name: Verify API over private container network
        run: >-
          docker compose -f deploy/compose.private-smoke.yaml run --rm --no-deps migrate
          node -e "fetch('http://api:4318/health').then(async r => {
          if (!r.ok || (await r.json()).status !== 'ok') process.exit(1)
          }).catch(() => process.exit(1))"
      - name: Verify fresh migrations
        run: >-
          docker compose -f deploy/compose.private-smoke.yaml exec -T db
          psql -U lvm -d lvm_service -tAc
          "SELECT count(*) FROM schema_migrations" | grep -x 2
      - if: always()
        run: docker compose -f deploy/compose.private-smoke.yaml down -v
